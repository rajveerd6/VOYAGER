<html>
<head>
<title>Contact - Space Project</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

  body {
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", sans-serif;
    background: radial-gradient(circle at center, #02010a, #000000 70%);
    color: #e6f7ff;
    
  }

  .container {
    position: relative;
    text-align: center;
    padding: 80px 20px;
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 48px;
    letter-spacing: 3px;
    margin-bottom: 40px;
    text-shadow: 0 0 15px #5dcfff;
  }

  .contact-card {
    width: 80%;
    max-width: 450px;
    margin: auto;
    padding: 30px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(100, 200, 255, 0.2);
    border-radius: 20px;
    box-shadow: 0 0 25px rgba(254, 255, 255, 0.3);
    backdrop-filter: blur(6px);
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .contact-card:hover {
    transform: scale(1.05);
    box-shadow: 0 0 35px rgba(246, 248, 248, 0.6);
  }

  .info {
    font-size: 20px;
    margin: 25px 0;
    letter-spacing: 1px;
  }

  .label {
    font-size: 13px;
    opacity: 0.8;
    text-transform: uppercase;
    letter-spacing: 2px;
  }
</style>

</head>

<body>

<div class="stars"></div>

<div class="container">
  <h1>Contact Us</h1>

  <div class="contact-card">
    <div class="info">
      <div class="label">Phone</div>
      +91 8856945979
    </div>

    <div class="info">
      <div class="label">Email</div>
     deshmukhrajveer72@gmail.com
    </div>
  </div>
</div>

</body>
</html>
