<html>
<head>
<meta charset="UTF-8">
<title>Login - Space Exploration</title>

<style>
  /* Import Orbitron font */
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&display=swap');

  body {
    margin: 0;
    padding: 0;
    background: radial-gradient(circle at center, #02010a, #000000 70%);
    font-family: "Segoe UI", sans-serif;
    color: #def4ff;
    height: 100vh;
    overflow: hidden;
  }

  .container {
    position: relative;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }

  .login-card {
    width: 350px;
    padding: 40px 30px;
    border-radius: 25px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(110, 210, 255, 0.25);
    backdrop-filter: blur(8px);
    box-shadow: 0 0 35px rgba(0, 160, 255, 0.4);
    text-align: center;
    transition: transform 0.4s ease, box-shadow 0.4s ease;
  }

  .login-card:hover {
    transform: scale(1.03);
    box-shadow: 0 0 45px rgba(0, 200, 255, 0.6);
  }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    margin-bottom: 25px;
    letter-spacing: 2px;
    text-shadow: 0 0 12px #57d1ff;
  }

  .input-box {
    margin: 15px 0;
    text-align: left;
  }

  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    font-family: 'Orbitron', sans-serif;
    color: #9ce6ff;
  }

  input {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: rgba(255, 255, 255, 0.1);
    color: #e6f7ff;
    font-size: 16px;
    outline: none;
    box-shadow: 0 0 15px rgba(0, 130, 200, 0.3) inset;
    transition: box-shadow 0.3s ease;
  }

  input:focus {
    box-shadow: 0 0 18px rgba(0, 200, 255, 0.8) inset;
  }
  .btn {
    width: 100%;
    padding: 12px;
    margin-top: 25px;
    border-radius: 12px;
    background: linear-gradient(90deg, #0cc2ff, #00eaff);
    color: black;
    font-size: 16px;
    font-weight: bold;
    letter-spacing: 2px;
    border: none;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 20px #00d4ff;
  }

  .note {
    margin-top: 18px;
    font-size: 13px;
    opacity: 0.7;
  }

</style>
</head>

<body>

<div class="stars"></div>

<div class="container">
  <div class="login-card">
    <h1>Log In</h1>

    <div class="input-box">
      <label>Username</label>
      <input type="text" placeholder="Enter your username">
    </div>

    <div class="input-box">
      <label>Password</label>
      <input type="password" placeholder="Enter your password">
    </div>

    <button class="btn">LOGIN</button>

    <div class="note">Access the Space Exploration Encyclopedia Dashboard</div>
  </div>
</div>

</body>
</html>
